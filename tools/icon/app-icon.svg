<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    WIN 解包工具 —— 应用图标（方案 A：开箱 + 内容浮出）
    矢量源文件。改这里即可，PNG/ICO 由 tools/icon/render.py 重新生成。
    配色与界面主题一致：#5B93F8 -> #2A63DE 斜向渐变。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B93F8"/>
      <stop offset="0.55" stop-color="#3D7BF2"/>
      <stop offset="1" stop-color="#2A63DE"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EDFF"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8E5FF"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="114"/>
    </clipPath>
  </defs>

  <!-- 圆角底 + 左上柔光 -->
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <ellipse cx="150" cy="80" rx="310" ry="200" fill="#FFFFFF" opacity="0.10"/>
  </g>

  <g transform="translate(0,-28)">
    <!-- 箱盖：从箱体后方左右翻出（先画，被箱体盖住内侧） -->
    <rect x="72" y="272" width="140" height="42" rx="21"
          fill="url(#flap)" transform="rotate(30 146 306)"/>
    <rect x="300" y="272" width="140" height="42" rx="21"
          fill="url(#flap)" transform="rotate(-30 366 306)"/>

    <!-- 箱体 -->
    <rect x="146" y="300" width="220" height="148" rx="28" fill="url(#box)"/>
    <!-- 箱口（内壁暗部） -->
    <ellipse cx="256" cy="308" rx="104" ry="17" fill="#2A63DE" opacity="0.22"/>

    <!-- 解出来的内容：三块大小递减的圆角方块 -->
    <g fill="#FFFFFF">
      <rect x="210" y="148" width="68" height="68" rx="20" opacity="0.96"/>
      <rect x="288" y="182" width="50" height="50" rx="15" opacity="0.66"/>
      <rect x="166" y="200" width="38" height="38" rx="11" opacity="0.44"/>
    </g>
  </g>
</svg>
